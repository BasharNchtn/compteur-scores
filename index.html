  --bg:#faf7f2;--card:#fff;--ink:#2b2622;--sub:#7a7168;--accent:#c2622f;--accent2:#8a9a6b;

<script>
const GAMES = {
  ohanami:{label:'Ohanami',icon:'🌸',mode:'ohanami',highWins:true},
  generique:{label:'Générique',icon:'🔢',mode:'rounds',highWins:true,configurable:true},
  millesabords:{label:'Mille Sabords',icon:'☠️',mode:'dice',highWins:true,target:6000},
  molkky:{label:'Mölkky',icon:'🪵',mode:'molkky',highWins:true}
};
const MOLKKY_ROWS=[[7,9,8],[5,11,12,6],[3,10,4],[1,2]];
function molkkyPinsSvg(){
  let out='';
  MOLKKY_ROWS.forEach((row,ri)=>{ const y=28+ri*48; row.forEach((n,i)=>{ const x=130+(i-(row.length-1)/2)*50;
    out+=`<g class="pin" data-n="${n}"><circle cx="${x}" cy="${y}" r="20"/><text x="${x}" y="${y}">${n}</text></g>`; }); });
  return `<svg viewBox="0 0 260 214" style="width:100%;max-width:280px;display:block;margin:0 auto" role="img" aria-label="Disposition initiale des 12 quilles">${out}<text x="130" y="206" style="font-size:11px;fill:var(--sub);text-anchor:middle">▼ lanceur (3 à 4 m)</text></svg>`;
}
function molkkyState(g){
  const rev=g.revived||{}, st={};
  g.players.forEach(p=>st[p]={total:0,misses:0,out:false,active:true,turns:[]});
  let winner=null, reason='';
  (g.turns||[]).forEach((tu,i)=>{
    const s=st[tu.player]; if(!s) return;
    const pts=Number(tu.points)||0, before=s.total; let after=before, kind='hit';
    if(pts===0){ s.misses++; kind='miss'; }
    else { s.misses=0; after=before+pts;
      if(after>50){ after=25; kind='over'; }
      else if(after===50){ kind='win'; if(!winner){ winner=tu.player; reason='50 pile'; } } }
    s.total=after; s.turns.push({idx:i,points:pts,before,after,kind,misses:s.misses});
  });
  g.players.forEach(p=>{ st[p].out=st[p].misses>=3; st[p].active=!st[p].out||!!rev[p]; });
  if(!winner && g.players.length>1){
    const alive=g.players.filter(p=>st[p].active);
    if(alive.length===1){ winner=alive[0]; reason='dernier joueur en lice'; }
  }
  return {st,winner,reason};
}
function pyramidal(n){ return n*(n+1)/2; }
const OHA_FIELDS=[['blue'],['blue','green'],['blue','green','gray','pink']];
const OHA_LABEL={blue:'Eau 🔵 (3pts)',green:'Végétation 🟢 (4pts)',gray:'Pierre ⬜ (7pts)',pink:'Sakura 🌸 (pyramidal)'};
function ohaFloor(game,ri,p,f){
  if((f==='blue'||f==='green') && ri>0){ const prev=game.ohanamiRounds[ri-1]&&game.ohanamiRounds[ri-1][p]; return prev?(prev[f]||0):0; }
  return 0;
}
function ohaMaxTotal(ri){ return (ri+1)*10; }
function ohaTotalCards(c){ return (c.blue||0)+(c.green||0)+(c.gray||0)+(c.pink||0); }
function ohaFieldScore(f,val){ if(f==='blue') return val*3; if(f==='green') return val*4; if(f==='gray') return val*7; if(f==='pink') return pyramidal(val); return 0; }
function ohaEnsureSeason(game, ri){
  if(!game.ohanamiRounds[ri]) game.ohanamiRounds[ri]={};
  game.players.forEach(p=>{
    if(!game.ohanamiRounds[ri][p]){
      const prev = ri>0 ? (game.ohanamiRounds[ri-1][p]||{}) : {};
      game.ohanamiRounds[ri][p]={blue:prev.blue||0, green:prev.green||0, gray:0, pink:0};
    }
  });
}
function ohanamiRoundScore(ri,c){
  let s=(c.blue||0)*3;
  if(ri>=1) s+=(c.green||0)*4;
  if(ri>=2) s+=(c.gray||0)*7 + pyramidal(c.pink||0);
  return s;
}
const COMBO={3:100,4:200,5:500,6:1000,7:2000,8:4000};
const PIRATE_CARDS={
  none:{label:'Aucune',double:false,gold:0,diamond:0,skull:0,merge:false},
  pirate:{label:'Pirate (points doublés)',double:true,gold:0,diamond:0,skull:0,merge:false},
  gold:{label:"Pièce d'or offerte (+1 dé or)",double:false,gold:1,diamond:0,skull:0,merge:false},
  diamond:{label:'Diamant offert (+1 dé diamant)',double:false,gold:0,diamond:1,skull:0,merge:false},
  skull1:{label:'Tête de mort ×1 (départ avec 1)',double:false,gold:0,diamond:0,skull:1,merge:false},
  skull2:{label:'Tête de mort ×2 (départ avec 2)',double:false,gold:0,diamond:0,skull:2,merge:false},
  animals:{label:'Animaux (singe+perroquet fusionnés)',double:false,gold:0,diamond:0,skull:0,merge:true},
  gardienne:{label:'Gardienne (relance exceptionnelle d\'un dé tête de mort — déjà reflété dans vos dés saisis)',double:false,gold:0,diamond:0,skull:0,merge:false},
  coffre:{label:"Coffre / Île au Trésor (points sécurisés même si tour perdu)",double:false,gold:0,diamond:0,skull:0,merge:false,special:'coffre'},
  corsaire:{label:'Corsaire / Bateau pirate (sabres requis, bonus ou malus)',double:false,gold:0,diamond:0,skull:0,merge:false,special:'corsaire'}
};
const CORSAIRE_TABLE={2:300,3:500,4:1000};
function calcMilleSabords(d, cardKey){
  const c=PIRATE_CARDS[cardKey]||PIRATE_CARDS.none;
  const rawSkull=+d.skull||0, rawGold=+d.gold||0, rawDiamond=+d.diamond||0, rawSabre=+d.sabre||0, rawSinge=+d.singe||0, rawPerroquet=+d.perroquet||0;
  const skull=rawSkull+c.skull;
  if(c.special==='corsaire'){
    const required=+d.sabreRequired||3, amount=CORSAIRE_TABLE[required]||500;
    if(rawSabre<required) return {score:-amount, detail:`Bateau pirate échoué (${rawSabre}/${required} sabres) : -${amount}pts, dés perdus.`};
    if(skull>=3) return {score:amount, detail:`3 têtes de mort, mais Bateau pirate réussi (${rawSabre}/${required} sabres) : +${amount}pts (reste des dés perdu par le bust).`};
  } else if(skull>=3){
    if(c.special==='coffre'){ const prot=+d.protected||0; return {score:prot, detail:`3 têtes de mort : tour perdu, mais ${prot} pts sécurisés dans le Coffre / Île au Trésor.`}; }
    return {score:0, detail:'3 têtes de mort ou plus : tour perdu.'};
  }
  const gold=rawGold+c.gold, diamond=rawDiamond+c.diamond, sabre=rawSabre;
  let groups;
  if(c.merge){ groups=[['or',gold,true],['diamant',diamond,true],['sabre',sabre,false],['animaux',rawSinge+rawPerroquet,false]]; }
  else { groups=[['or',gold,true],['diamant',diamond,true],['sabre',sabre,false],['singe',rawSinge,false],['perroquet',rawPerroquet,false]]; }
  let score=0, detail=[];
  groups.forEach(([name,count,indiv])=>{
    const combo = count>=3 ? COMBO[Math.min(count,8)] : 0;
    const indivPts = indiv ? count*100 : 0;
    if(count>0) detail.push(`${name}×${count}${combo?` (combo ${combo})`:''}${indivPts?` (+${indivPts})`:''}`);
    score += combo + indivPts;
  });
  const physicalUsed = rawSkull+rawGold+rawDiamond+rawSabre+rawSinge+rawPerroquet;
  const wasted = groups.some(([,count,indiv])=> !indiv && count>0 && count<3);
  let bonus='';
  if(skull===0 && physicalUsed===8 && !wasted){ score+=500; bonus=' + 500 (coffre plein)'; }
  let win=false;
  groups.forEach(([name,count])=>{ if(count>=9){ win=true; } });
  if(win) bonus+=' 🏆 MAGIE PIRATE (9 symboles identiques) : VICTOIRE IMMÉDIATE !';
  if(c.special==='corsaire'){
    const required=+d.sabreRequired||3, amount=CORSAIRE_TABLE[required]||500;
    score+=amount; bonus+=` + ${amount} (Bateau pirate réussi, ${rawSabre}/${required} sabres)`;
  }
  if(c.double){ score*=2; bonus+=' ×2 (carte Pirate)'; }
  return {score, detail: (detail.join(', ')||'aucun dé scorant')+bonus, win};
}

// ---- Rotation des tours : fonctions pures, testables indépendamment du DOM ----
function genericTurnsNextPlayer(game){
  const turns=game.turns||[];
  const lastP=turns.length?turns[turns.length-1].player:null;
  return lastP ? game.players[(game.players.indexOf(lastP)+1)%game.players.length] : game.players[0];
}
function millesabordsNextPlayer(game){
  const rot=(game.turns||[]).filter(tu=>!tu.malus);
  const lastP=rot.length?rot[rot.length-1].player:null;
  return lastP ? game.players[(game.players.indexOf(lastP)+1)%game.players.length] : game.players[0];
}
function molkkyNextPlayer(game){
  const {st}=molkkyState(game);
  const order=game.players;
  const lastP=(game.turns&&game.turns.length)?game.turns[game.turns.length-1].player:null;
  const startIdx=lastP?(order.indexOf(lastP)+1)%order.length:0;
  for(let i=0;i<order.length;i++){ const idx=(startIdx+i)%order.length; if(st[order[idx]].active) return order[idx]; }
  return order[startIdx];
}

// ---- Migration de schéma : garantit qu'une partie chargée (ancienne sauvegarde, import JSON) a tous les champs attendus ----
const SCHEMA_VERSION = 1;
function migrateGame(game){
  if(!game) return game;
  game.rounds = game.rounds || [];
  game.turns = game.turns || [];
  game.players = game.players || [];
  game.highWins = game.highWins !== undefined ? game.highWins : true;
  game.entryMode = game.entryMode || 'together';
  if(game.gameType==='ohanami'){
    game.ohanamiRounds = game.ohanamiRounds || [{},{},{}];
    game.ohanamiCurrentSeason = game.ohanamiCurrentSeason || 0;
  }
  if(game.gameType==='molkky'){
    game.revived = game.revived || {};
    game.hidePins = !!game.hidePins;
  }
  game.schemaVersion = SCHEMA_VERSION;
  return game;
}

let tab = 'players';
let players = loadJSON('bs_players', []);
let view = {}; // per-game current in-progress game, keyed by gameType
let podiumMode = {}; // per-game : affichage transitoire de l'écran "score en cours" / fin de partie

function loadJSON(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function savedGames(gt){return loadJSON('bs_saved_'+gt,[]);}
function setSavedGames(gt,arr){saveJSON('bs_saved_'+gt,arr);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function exportJSON(obj, filename, statusEl){
  const data = JSON.stringify(obj, null, 2);
  if(statusEl) statusEl.textContent='Export en cours…';
  try{
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    if(statusEl) statusEl.textContent='✅ Fichier téléchargé.';
  }catch(e){ if(statusEl) statusEl.textContent='❌ Téléchargement impossible : '+(e.message||'erreur inconnue'); }
}

// ---- Steppers (+/- génériques) : tout bouton .step[data-target][data-step] ajuste l'input ciblé ----
function bindSteppers(root){
  root.querySelectorAll('.step[data-target]').forEach(b=>{
    b.onclick=()=>{
      const inp=root.querySelector('#'+CSS.escape(b.dataset.target));
      if(!inp) return;
      const min=(inp.min!==''&&inp.min!==undefined)?+inp.min:-Infinity;
      const max=(inp.max!==''&&inp.max!==undefined)?+inp.max:Infinity;
      let v=(+inp.value||0)+(+b.dataset.step);
      v=Math.max(min,Math.min(max,v));
      inp.value=v;
      inp.dispatchEvent(new Event('change'));
    };
  });
}

// ---- Confirmation de suppression partagée ----
function attachDeleteConfirm(scopeEl, onConfirm){
  scopeEl.querySelector('#delturn').onclick=()=>{
    const box=scopeEl.querySelector('#delconfirm');
    box.innerHTML=`<span class="sublabel">Confirmer la suppression ?</span>
      <button class="danger" id="delyes">Oui, supprimer</button> <button class="ghost" id="delno">Annuler</button>`;
    box.querySelector('#delyes').onclick=onConfirm;
    box.querySelector('#delno').onclick=()=>{ box.innerHTML=''; };
  };
}

// ---- Éditeur de tour simple (score seul, sans détail de dés/cartes) : utilisé par Générique, Mölkky, Mille Sabords (entrées malus/île) ----
function renderSimpleTurnEditor(m, game, gt, idx, headerHtml, opts){
  opts = opts || {};
  const tu = game.turns[idx];
  const min = opts.min!==undefined ? opts.min : null;
  const max = opts.max!==undefined ? opts.max : null;
  const box = m.querySelector('#turndetailbox');
  box.innerHTML = `<b>${headerHtml}</b>
    <div class="row" style="margin-top:.4rem">
      <input type="number" ${min!==null?`min="${min}"`:''} ${max!==null?`max="${max}"`:''} id="editval" value="${tu.points}" style="width:5rem">
      <button class="ghost" id="saveturn">Enregistrer</button>
      <button class="danger" id="delturn">Supprimer</button>
    </div><div id="delconfirm"></div>`;
  box.querySelector('#saveturn').onclick=()=>{
    let v=+box.querySelector('#editval').value||0;
    if(min!==null) v=Math.max(min,v);
    if(max!==null) v=Math.min(max,v);
    game.turns[idx].points=v;
    if(opts.onSave) opts.onSave();
    persistGame(gt); render();
  };
  attachDeleteConfirm(box, ()=>{ game.turns.splice(idx,1); persistGame(gt); render(); });
}
function importJSON(cb){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='application/json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{try{cb(JSON.parse(r.result));}catch(e){alert('Fichier JSON invalide');}};
    r.readAsText(f);
  };
  inp.click();
}

function renderTabs(){

// ---- Setup / reprise d'une partie ----
function renderGameSetup(m, gt){
  const g=GAMES[gt];
  if(view[gt]) return renderPlay(m, gt);
  const saved=savedGames(gt);
  m.innerHTML=`
  <div class="card">
    <h2>${g.icon} ${g.label} — nouvelle partie</h2>
    <div class="sublabel">Sélectionnez les joueurs</div>
    <div class="row" id="psel"></div>
    <div class="row" style="margin-top:.6rem">
      <input type="text" id="newp2" placeholder="Ajouter un joueur">
      <button class="sub" id="addp2">+</button>
    </div>
    <div class="sublabel" id="orderlabel" style="margin-top:.8rem;display:none">Ordre de jeu</div>
    <div id="orderlist"></div>
    ${g.configurable?`<div class="sublabel" style="margin-top:.8rem">Qui gagne ?</div>
    <div class="row"><span class="chip sel" data-hw="1">Le plus haut score</span><span class="chip" data-hw="0">Le plus bas score</span></div>
    <div class="sublabel" style="margin-top:.8rem">Saisie des scores</div>
    <div class="row"><span class="chip sel" data-em="together">Tous ensemble (par manche)</span><span class="chip" data-em="turns">Chacun son tour</span></div>`:''}
    <div style="margin-top:1rem"><button id="start">Jouer ▶</button></div>
  </div>
  ${saved.length?`<div class="card">
    <h2>Parties en cours</h2>
    ${saved.map(s=>`<div class="saved-item"><span>${s.players.join(', ')}<br><small class="sublabel">${new Date(s.date).toLocaleString()}</small></span>
      <span class="row"><button class="sub" data-resume="${s.id}">Reprendre</button><button class="danger" data-del="${s.id}">✕</button></span></div>`).join('')}
  </div>`:''}
  <div class="card row">
    <button class="ghost" id="impg">Importer une partie (JSON)</button>
  </div>`;
  let sel=loadJSON('bs_lastplayers_'+gt,[]).filter(p=>players.includes(p));
  let highWinsChoice=true;
  let entryModeChoice='together';
  m.querySelectorAll('[data-hw]').forEach(c=>c.onclick=()=>{
    m.querySelectorAll('[data-hw]').forEach(x=>x.classList.remove('sel'));
    c.classList.add('sel'); highWinsChoice = c.dataset.hw==='1';
  });
  m.querySelectorAll('[data-em]').forEach(c=>c.onclick=()=>{
    m.querySelectorAll('[data-em]').forEach(x=>x.classList.remove('sel'));
    c.classList.add('sel'); entryModeChoice = c.dataset.em;
  });
  const psel=m.querySelector('#psel');
  const orderlist=m.querySelector('#orderlist');
  const orderlabel=m.querySelector('#orderlabel');
  function drawSel(){
    psel.innerHTML=players.map(p=>`<span class="chip ${sel.includes(p)?'sel':''}" data-p="${p}">${p}</span>`).join('')||'<span class="sublabel">Ajoutez des joueurs d\'abord.</span>';
    psel.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
      const p=c.dataset.p;
      if(sel.includes(p)) sel=sel.filter(x=>x!==p); else sel.push(p);
      drawSel();
    });
    orderlabel.style.display = sel.length ? '' : 'none';
    orderlist.innerHTML = sel.map((p,i)=>`<div class="saved-item"><span>${i+1}. ${p}</span>
      <span class="row"><button class="ghost" data-up="${i}" ${i===0?'disabled':''}>▲</button><button class="ghost" data-down="${i}" ${i===sel.length-1?'disabled':''}>▼</button></span></div>`).join('');
    orderlist.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; [sel[i-1],sel[i]]=[sel[i],sel[i-1]]; drawSel(); });
    orderlist.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.down; [sel[i+1],sel[i]]=[sel[i],sel[i+1]]; drawSel(); });
  }
  drawSel();
  m.querySelector('#addp2').onclick=()=>{
    const inp=m.querySelector('#newp2'); const v=inp.value.trim();
    if(v){ if(!players.includes(v)){players.push(v);saveJSON('bs_players',players);} if(!sel.includes(v)) sel.push(v); inp.value=''; drawSel();}
  };
  m.querySelector('#start').onclick=()=>{
    if(sel.length<1) return alert('Choisissez au moins un joueur.');
    saveJSON('bs_lastplayers_'+gt, sel);
    view[gt]=migrateGame({id:uid(),date:Date.now(),gameType:gt,players:[...sel],rounds:[],turns:[],highWins:g.configurable?highWinsChoice:g.highWins,entryMode:g.configurable?entryModeChoice:'together'});
    render();
  };
  m.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>{
    view[gt]=migrateGame(saved.find(s=>s.id===b.dataset.resume)); render();
  });
  m.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    setSavedGames(gt, saved.filter(s=>s.id!==b.dataset.del)); render();
  });
  m.querySelector('#impg').onclick=()=>importJSON(d=>{
    if(d && d.gameType===gt){view[gt]=migrateGame(d); render();} else alert('Ce fichier ne correspond pas à ce jeu.');
  });
}

function persistGame(gt){
  const g=view[gt]; let saved=savedGames(gt);
  saved=saved.filter(s=>s.id!==g.id); saved.push(g);
  setSavedGames(gt,saved);
}
function endGame(gt){
  let saved=savedGames(gt).filter(s=>s.id!==view[gt].id);
  setSavedGames(gt,saved); view[gt]=null; render();
}

function totals(g){
  const t={}; g.players.forEach(p=>t[p]=0);
  if(g.gameType==='ohanami'){
    (g.ohanamiRounds||[]).forEach((round,ri)=>{ g.players.forEach(p=>{ const c=round[p]; if(c) t[p]+=ohanamiRoundScore(ri,c); }); });
    return t;
  }
  if(g.gameType==='molkky'){
    const {st}=molkkyState(g); g.players.forEach(p=>t[p]=st[p].total); return t;
  }
  (g.rounds||[]).forEach(r=>g.players.forEach(p=>t[p]+=Number(r.scores[p]||0)));
  (g.turns||[]).forEach(tu=>{ if(g.players.includes(tu.player)) t[tu.player]+=Number(tu.points||0); });
  if(g.gameType==='millesabords') g.players.forEach(p=>{ if(t[p]<0) t[p]=0; });
  return t;
}
function ranking(g,totalsObj,highWins){
  return [...g.players].sort((a,b)=> highWins? totalsObj[b]-totalsObj[a] : totalsObj[a]-totalsObj[b]);
}

function renderOhanami(body, game, gt, t){
  game.ohanamiRounds = game.ohanamiRounds || [{},{},{}];
  const cs = game.ohanamiCurrentSeason||0;
  ohaEnsureSeason(game, cs);
  const fields = OHA_FIELDS[cs];
  const visibleSeasons=[0,1,2].filter(ri=>ri<=cs);
  body.innerHTML = `<table><thead><tr><th>Joueur</th>${visibleSeasons.map(ri=>`<th>Saison ${ri+1}</th>`).join('')}<th>Total</th></tr></thead><tbody>
    ${game.players.map(p=>{
      const s=visibleSeasons.map(ri=>{ const c=(game.ohanamiRounds[ri]&&game.ohanamiRounds[ri][p])||{}; return ohanamiRoundScore(ri,c); });
      const restrictedTotal=s.reduce((a,b)=>a+b,0);
      return `<tr><td>${p}</td>${s.map(v=>`<td>${v}</td>`).join('')}<td><b>${restrictedTotal}</b></td></tr>`;
    }).join('')}
    </tbody></table>
    <div class="row" style="margin-top:.8rem">
      <button class="ghost" id="ohaprev" ${cs===0?'disabled':''}>◀ Saison précédente</button>
      <span class="sublabel">Saison ${cs+1} / 3</span>
      <button class="ghost" id="ohanext" ${cs===2?'disabled':''}>Saison suivante ▶</button>
    </div>
    <div class="card" style="margin-top:.6rem;background:var(--bg)">
      <h2>🌸 Saison ${cs+1}</h2>
      <table><thead><tr><th>Joueur</th>${fields.map(f=>`<th>${OHA_LABEL[f]}</th>`).join('')}<th>Score saison</th></tr></thead><tbody>
      ${game.players.map(p=>{ const c=game.ohanamiRounds[cs][p]; const rs=ohanamiRoundScore(cs,c); const total=ohaTotalCards(c); const maxT=ohaMaxTotal(cs);
        return `<tr><td>${p}</td>${fields.map(f=>{ const floor=ohaFloor(game,cs,p,f); const val=c[f]||0; const fid=`oha${cs}_${game.players.indexOf(p)}_${f}`;
          return `<td><div class="row" style="gap:.2rem;justify-content:center;flex-wrap:nowrap">
          <button type="button" class="ghost step" data-target="${fid}" data-step="-1" style="padding:.25rem .55rem" ${val<=floor?'disabled':''}>−</button>
          <input type="number" min="${floor}" class="no-spin" id="${fid}" data-ri="${cs}" data-p="${p}" data-f="${f}" value="${val}" style="width:2.4rem;text-align:center">
          <button type="button" class="ghost step" data-target="${fid}" data-step="1" style="padding:.25rem .55rem" ${total>=maxT?'disabled':''}>+</button>
        </div><div class="sublabel" style="text-align:center">= ${ohaFieldScore(f,val)}pts</div></td>`; }).join('')}<td>${rs}</td></tr>`; }).join('')}
      </tbody></table>
      <div class="sublabel">Nombre de cartes cumulées dans les jardins depuis le début de la partie (ça ne peut qu'augmenter).</div>
    </div>`;
  body.querySelectorAll('[data-ri]').forEach(inp=>inp.onchange=()=>{
    const ri=+inp.dataset.ri, p=inp.dataset.p, f=inp.dataset.f;
    game.ohanamiRounds[ri][p]=game.ohanamiRounds[ri][p]||{blue:0,green:0,gray:0,pink:0};
    const c=game.ohanamiRounds[ri][p];
    const floor=ohaFloor(game,ri,p,f);
    const otherTotal=ohaTotalCards(c)-(c[f]||0);
    const maxT=ohaMaxTotal(ri);
    let val=+inp.value||0;
    if(val<floor) val=floor;
    if(otherTotal+val>maxT) val=Math.max(floor, maxT-otherTotal);
    c[f]=val;
    if(f==='blue'||f==='green'){
      for(let s=ri+1;s<=2;s++){
        if(game.ohanamiRounds[s] && game.ohanamiRounds[s][p]){
          game.ohanamiRounds[s][p][f]=Math.max(game.ohanamiRounds[s][p][f]||0, c[f]);
        }
      }
    }
    persistGame(gt); render();
  });
  const prevBtn=body.querySelector('#ohaprev'), nextBtn=body.querySelector('#ohanext');
  if(prevBtn) prevBtn.onclick=()=>{ game.ohanamiCurrentSeason=Math.max(0,(game.ohanamiCurrentSeason||0)-1); persistGame(gt); render(); };
  if(nextBtn) nextBtn.onclick=()=>{ game.ohanamiCurrentSeason=Math.min(2,(game.ohanamiCurrentSeason||0)+1); persistGame(gt); render(); };
}

  body.innerHTML = `${game.finished?`<div class="card" style="background:var(--accent);color:#fff;text-align:center;font-weight:700">🏆 ${game.winner} remporte la partie — Magie Pirate (9 symboles identiques) ! 🏆</div>`:''}
  <div class="sublabel">Objectif : ${g.target} points.</div>
  <table><thead><tr><th>Joueur</th><th>Total</th></tr></thead><tbody>
  ${game.players.map(p=>`<tr><td>${p}${t[p]>=g.target?' 🏆':''}</td><td>${t[p]}</td></tr>`).join('')}
  </tbody></table>
  ${game.players.map(p=>`<div class="sublabel" style="margin-top:.5rem"><b>${p}</b></div><div class="row">
    ${tbp[p].length? tbp[p].map((tu,ix)=>`<span class="chip" data-turn="${tu.idx}">Tour ${ix+1} : ${tu.points}</span>`).join('') : '<span class="sublabel">Aucun tour joué</span>'}</div>`).join('')}
  <div id="turndetailbox" class="sublabel" style="margin-top:.5rem"></div>
  <div class="card" style="margin-top:1rem;background:var(--bg)">
    <h2>Nouveau tour — <span style="color:var(--accent)">${nextP}</span></h2>
    <div class="sublabel">Carte Pirate active</div>
    <select id="cardkey" style="width:100%;padding:.5rem;border-radius:8px">
      ${Object.entries(PIRATE_CARDS).map(([k,c])=>`<option value="${k}">${c.label}</option>`).join('')}
    </select>
    <div class="row" style="margin-top:.6rem">
      <label style="display:flex;align-items:center;gap:.4rem"><input type="checkbox" id="isIsland"> Île de la Tête-de-Mort (4+ crânes au 1er lancer)</label>
    </div>
    <div id="cardExtra"></div>
    <div id="diceblock">
      <div class="sublabel" style="margin-top:.6rem">Dés obtenus</div>
      <div class="row">
        ${[['skull','💀'],['gold','🪙'],['diamond','💎'],['sabre','⚔️'],['singe','🐒'],['perroquet','🦜']].map(([id,icon])=>`<span style="min-width:3.6rem;text-align:center"><span style="font-size:1.6rem;display:block">${icon}</span>
          <button type="button" class="ghost step" data-target="d_${id}" data-step="-1" style="padding:.2rem .5rem">−</button>
          <input type="number" min="0" class="no-spin" id="d_${id}" value="0" style="width:2.2rem;text-align:center">
          <button type="button" class="ghost step" data-target="d_${id}" data-step="1" style="padding:.2rem .5rem">+</button></span>`).join('')}
      </div>
      <div class="row" style="margin-top:.6rem"><button class="ghost" id="calc">Calculer</button>
      <span>Score du tour (modifiable) : <input type="number" id="turnscore" value="0" style="width:5rem"></span></div>
      <div class="sublabel" id="calcdetail">⚠️ Barème officiel (3=100, 4=200, 5=500, 6=1000, 7=2000, 8=4000 ; or/diamant +100 chacun). Cartes Bataille pirate / Île au trésor non gérées ici.</div>
    </div>
    <div id="islandblock" style="display:none;margin-top:.6rem">
      <div class="sublabel">Nombre de têtes de mort obtenues aux dés sur l'île (hors bonus carte)</div>
      <button type="button" class="ghost step" data-target="islandskulls" data-step="-1">−</button>
      <input type="number" min="4" class="no-spin" id="islandskulls" value="4" style="width:3rem;text-align:center">
      <button type="button" class="ghost step" data-target="islandskulls" data-step="1">+</button>
      <div class="sublabel">Carte active "${PIRATE_CARDS.skull1.label}"/"${PIRATE_CARDS.skull2.label}" : bonus ajouté automatiquement au total. Chaque adversaire perd 100 pts par tête (200 si carte Pirate active). ${nextP} ne marque rien ce tour.</div>
    </div>
    <div style="margin-top:.6rem"><button id="validate">Valider le tour</button> <button class="danger" id="lostBtn">Tour perdu (3+ crânes)</button></div>
  </div>`;

  function renderCardExtra(){
    const ck=body.querySelector('#cardkey').value, extra=body.querySelector('#cardExtra');
    const card=PIRATE_CARDS[ck];
    if(card.special==='coffre'){
      extra.innerHTML=`<div class="sublabel" style="margin-top:.4rem">Points déjà sécurisés dans le Coffre (comptent même si le tour est perdu)</div><input type="number" id="protectedPts" value="0" style="width:6rem">`;
    } else if(card.special==='corsaire'){
      extra.innerHTML=`<div class="sublabel" style="margin-top:.4rem">Sabres requis (bonus/malus prédéfini, ajustez sur vos cartes si différent)</div>
        <select id="sabreRequired" style="padding:.4rem;border-radius:8px">${Object.entries(CORSAIRE_TABLE).map(([n,pts])=>`<option value="${n}">${n} sabres → ±${pts}pts</option>`).join('')}</select>`;
    } else { extra.innerHTML=''; }
  }
  body.querySelector('#cardkey').onchange=renderCardExtra; renderCardExtra();
  body.querySelector('#isIsland').onchange=(e)=>{
    body.querySelector('#diceblock').style.display = e.target.checked ? 'none' : '';
    body.querySelector('#islandblock').style.display = e.target.checked ? '' : 'none';
  };
  body.querySelector('#lostBtn').onclick=()=>{
    const p=editingIndex!==null?game.turns[editingIndex].player:nextP;
    const entry={player:p,points:0,detail:'Tour perdu (3+ têtes de mort)',cardLabel:PIRATE_CARDS[body.querySelector('#cardkey').value].label,malus:false};
    game.turns=game.turns||[];
    if(editingIndex!==null) game.turns[editingIndex]=entry; else game.turns.push(entry);
    persistGame(gt); render();
  };
  body.querySelector('#calc').onclick=()=>{
    const d={skull:body.querySelector('#d_skull').value,gold:body.querySelector('#d_gold').value,diamond:body.querySelector('#d_diamond').value,
      sabre:body.querySelector('#d_sabre').value,singe:body.querySelector('#d_singe').value,perroquet:body.querySelector('#d_perroquet').value};
    const pe=body.querySelector('#protectedPts'); if(pe) d.protected=pe.value;
    const sr=body.querySelector('#sabreRequired'); if(sr){ d.sabreRequired=sr.value; }
    const {score,detail,win}=calcMilleSabords(d, body.querySelector('#cardkey').value);
    body.querySelector('#turnscore').value=score;
    const totalDice=(+d.skull||0)+(+d.gold||0)+(+d.diamond||0)+(+d.sabre||0)+(+d.singe||0)+(+d.perroquet||0);
    const warn = totalDice!==8 ? `⚠️ ${totalDice} dé(s) saisi(s) au lieu de 8 attendus. ` : '';
    const box=body.querySelector('#calcdetail'); box.textContent=warn+'Détail : '+detail; box.dataset.detail=detail; box.dataset.win=win?'1':'';
    if(win) box.style.cssText='color:var(--accent);font-weight:700;';
  };
  body.querySelector('#validate').onclick=()=>{
    const cardKey=body.querySelector('#cardkey').value;
    game.turns=game.turns||[];
    if(body.querySelector('#isIsland').checked){
      const p=nextP;
      const diceSkulls=+body.querySelector('#islandskulls').value||0;
      const totalSkulls=diceSkulls+PIRATE_CARDS[cardKey].skull;
      const per = PIRATE_CARDS[cardKey].double ? 200 : 100;
      game.turns.push({player:p,points:0,detail:`Île de la Tête-de-Mort : ${diceSkulls} crâne(s) aux dés + ${PIRATE_CARDS[cardKey].skull} (carte) = ${totalSkulls} — adversaires -${per}pts chacun`,cardLabel:PIRATE_CARDS[cardKey].label,malus:false});
      game.players.forEach(op=>{ if(op!==p) game.turns.push({player:op,points:-(totalSkulls*per),detail:`Île de la Tête-de-Mort déclenchée par ${p} (${totalSkulls} crânes)`,cardLabel:'—',malus:true}); });
    } else {
      const pts=+body.querySelector('#turnscore').value||0;
      const box=body.querySelector('#calcdetail');
      const detail=box.dataset.detail || 'Score saisi/modifié manuellement';
      const dice={skull:body.querySelector('#d_skull').value,gold:body.querySelector('#d_gold').value,diamond:body.querySelector('#d_diamond').value,
        sabre:body.querySelector('#d_sabre').value,singe:body.querySelector('#d_singe').value,perroquet:body.querySelector('#d_perroquet').value};
      if(editingIndex!==null){
        const p=game.turns[editingIndex].player;
        game.turns[editingIndex]={player:p,points:pts,detail,cardLabel:PIRATE_CARDS[cardKey].label,cardKey,dice,malus:false};
      } else {
        game.turns.push({player:nextP,points:pts,detail,cardLabel:PIRATE_CARDS[cardKey].label,cardKey,dice,malus:false});
        if(box.dataset.win==='1'){ game.winner=nextP; game.finished=true; }
      }
    }
    persistGame(gt); render();
  };
  body.querySelectorAll('[data-turn]').forEach(chip=>chip.onclick=()=>{
    const idx=+chip.dataset.turn, tu=game.turns[idx];
    if(tu.dice){
      const box=body.querySelector('#turndetailbox');
      box.innerHTML=`<b>${tu.player} — ${tu.points} pts</b><br>Carte : ${tu.cardLabel||'—'}<br>${tu.detail||''}
        <div class="row" style="margin-top:.4rem">
          <button class="ghost" id="editdice">Modifier (reprendre les dés)</button>
          <button class="danger" id="delturn">Supprimer</button>
        </div>
        <div id="delconfirm"></div>`;
      box.querySelector('#editdice').onclick=()=>{
        editingIndex=idx;
        body.querySelector('#isIsland').checked=false;
        body.querySelector('#diceblock').style.display='';
        body.querySelector('#islandblock').style.display='none';
        body.querySelector('#cardkey').value=tu.cardKey||'none';
        renderCardExtra();
        ['skull','gold','diamond','sabre','singe','perroquet'].forEach(id=>body.querySelector('#d_'+id).value=tu.dice[id]||0);
        body.querySelector('#turnscore').value=tu.points;
        body.querySelector('#calcdetail').textContent='Détail : '+(tu.detail||'');
        body.querySelector('#calcdetail').dataset.detail=tu.detail||'';
        body.querySelector('#validate').textContent='Enregistrer la modification';
        body.querySelector('#diceblock').scrollIntoView({behavior:'smooth'});
      };
      attachDeleteConfirm(box, ()=>{ game.turns.splice(idx,1); persistGame(gt); render(); });
    } else {
      renderSimpleTurnEditor(body, game, gt, idx, `${tu.player} — ${tu.points} pts<br>Carte : ${tu.cardLabel||'—'}<br>${tu.detail||''}`, {
        onSave: ()=>{ game.turns[idx].detail='Score modifié manuellement'; }
      });
    }
  });
}

// ---- Écran de jeu : simple aiguillage vers le rendu du mode concerné ----
// ---- Écran "Score en cours" / fin de partie : podium agrandi, réutilisé pour les deux usages ----
function renderPodium(m, gt, game, g, t){
  const hw = game.highWins ?? g.highWins;
  const rank = ranking(game, t, hw);
  const medals=['🥇','🥈','🥉'];
  m.innerHTML = `<div class="card" style="text-align:center">
    <h2>${g.icon} ${g.label}</h2>
    ${rank.map((p,i)=>`<div style="margin:1.1rem 0">
      <div style="font-size:${i===0?'2.2rem':i===1?'1.8rem':'1.4rem'}">${medals[i]||'　'} ${p}</div>
      <div style="font-size:${i===0?'3.4rem':'2.4rem'};font-weight:700;color:var(--accent)">${t[p]}</div>
    </div>`).join('')}
  </div>
  <div class="card row" style="justify-content:center">
    <button class="sub" id="podiumBack">◀ Retour à la partie</button>
    <button class="danger" id="podiumFinish">Terminer la partie</button>
  </div>
  <div id="podiumFinishConfirm"></div>`;
  m.querySelector('#podiumBack').onclick=()=>{ podiumMode[gt]=false; render(); };
  m.querySelector('#podiumFinish').onclick=()=>{
    const box=m.querySelector('#podiumFinishConfirm');
    box.innerHTML=`<div class="card row" style="justify-content:center"><span class="sublabel">Terminer et supprimer cette partie sauvegardée ?</span>
      <button class="danger" id="pfYes">Oui, terminer</button> <button class="ghost" id="pfNo">Annuler</button></div>`;
    box.querySelector('#pfYes').onclick=()=>{ podiumMode[gt]=false; endGame(gt); };
    box.querySelector('#pfNo').onclick=()=>{ box.innerHTML=''; };
  };
}

function renderPlay(m, gt){
  const g=GAMES[gt], game=view[gt];
  migrateGame(game);
  const hw = game.highWins ?? g.highWins;
  const t=totals(game); const rank=ranking(game,t,hw);
  if(podiumMode[gt]) return renderPodium(m, gt, game, g, t);
  const usesTurns = g.mode==='molkky' || g.mode==='dice' || (g.mode==='rounds' && game.entryMode==='turns');
  const canUndo = usesTurns && game.turns && game.turns.length>0;
  m.innerHTML=`<div class="card">
    <h2>${g.icon} ${g.label} ${rank.length?`— en tête : <span class="rank1">${rank[0]}</span>`:''}</h2>
    <div id="modebody"></div>
  </div>
  <div class="card row">
    <button class="ghost" id="exportg">Exporter la partie (JSON)</button>
    <button class="ghost" id="quit">Suspendre / Changer</button>
    ${canUndo?'<button class="ghost" id="undoBtn">↩ Annuler le dernier coup</button>':''}
    <button class="sub" id="podiumBtn">🏆 Score en cours</button>
    <span class="sublabel" id="expstatus2"></span>
  </div>`;
  const body = m.querySelector('#modebody');
  if(g.mode==='rounds' && game.entryMode!=='turns') renderRoundsTogether(body, game, gt, t);
  else if(g.mode==='rounds' && game.entryMode==='turns') renderRoundsTurns(body, game, gt, t);
  else if(g.mode==='ohanami') renderOhanami(body, game, gt, t);
  else if(g.mode==='molkky') renderMolkky(body, game, gt, t);
  else renderMilleSabords(body, game, gt, g, t);
  bindSteppers(m);
  m.querySelector('#exportg').onclick=()=>exportJSON(game, gt+'_'+new Date(game.date).toISOString().slice(0,10)+'.json', m.querySelector('#expstatus2'));
  m.querySelector('#quit').onclick=()=>{persistGame(gt); view[gt]=null; render();};
  m.querySelector('#podiumBtn').onclick=()=>{ podiumMode[gt]=true; render(); };
  const undoBtn=m.querySelector('#undoBtn');
  if(undoBtn) undoBtn.onclick=()=>{
    if(!game.turns || !game.turns.length) return;
    while(game.turns.length && game.turns[game.turns.length-1].malus){ game.turns.pop(); }
    if(game.turns.length) game.turns.pop();
    if(g.mode==='dice'){ game.finished=false; game.winner=undefined; }
    persistGame(gt); render();
  };
}

render();

</script>
